<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ebb0bd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quest Room">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>window.CQR_PWA=true</script>
<title>Cozy Quest Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Nunito:wght@400;600;700&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a soft paper planner. Date masthead; pixel room and the now-reading/watching shelf on the left, stats, mana and focus potion on the right; pill tabs switch one page at a time */
:root{
  --bg:#f3ebe5; --paper:#faf5f0; --wash:#efe2df; --ink:#594350; --ink-soft:#97808b; --line:#e6d7d0; --rule:#dccac3; --shadow:rgba(120,80,70,.09);
  --acc:#ebb0bd; --acc-deep:#d98a9e; --acc-ink:#a9516a; --on-acc:#4b3340;
  --c-work:#f4a3b6; --c-study:#c6b2ee; --c-health:#a7d6b2; --c-create:#f6d58a; --c-rest:#a8d3ee;
  --s-wall:#f3dcdd; --s-wall2:#f9e9e8; --s-floor:#e2c2a8; --s-floor2:#d4af92; --s-trim:#fbf5f1; --s-wood:#d7a27f; --s-curtain:#ffffff; --s-dark:0;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-pixel:"Pixelify Sans","Courier New",monospace;
  --f-body:"Nunito","Trebuchet MS",system-ui,sans-serif;
  --f-ui:"DM Mono",ui-monospace,"Courier New",monospace;
}
:root[data-skin="lavender"]{--bg:#f1edf5;--wash:#e8e1f1;--line:#ded5ea;--rule:#d2c7e2;--acc:#cbb8f2;--acc-deep:#a68ce0;--acc-ink:#7d5fc0;--s-wall:#e6dff3;--s-wall2:#efe9f8;--s-floor:#e2cdb8;--s-floor2:#d4bba3}
:root[data-skin="matcha"]{--bg:#eef1e9;--wash:#e2eadb;--line:#d6e0cf;--rule:#c8d6bf;--acc:#b5dbad;--acc-deep:#8cc282;--acc-ink:#4f8a46;--s-wall:#dde9d5;--s-wall2:#e8f1e2;--s-floor:#e3cfb3;--s-floor2:#d4bd9d}
:root[data-skin="peach"]{--bg:#f5ece4;--wash:#f0e0d3;--line:#e8d6c7;--rule:#dfc7b4;--acc:#f9c19f;--acc-deep:#ef9f74;--acc-ink:#b8643a;--s-wall:#f3dfd0;--s-wall2:#f9ebe1;--s-floor:#e9c8a6;--s-floor2:#dbb48f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2b2421;--paper:#352d29;--wash:#40362f;--ink:#f7ece4;--ink-soft:#c9b6a8;--line:#4d423b;--rule:#5e5047;--shadow:rgba(0,0,0,.28);--acc-ink:var(--acc);
  --s-wall:#5a4a40;--s-wall2:#655448;--s-floor:#6b5243;--s-floor2:#5c4639;--s-trim:#8c786a;--s-wood:#9a7158;--s-curtain:#e3d3c6;--s-dark:1;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2b2421;--paper:#352d29;--wash:#40362f;--ink:#f7ece4;--ink-soft:#c9b6a8;--line:#4d423b;--rule:#5e5047;--shadow:rgba(0,0,0,.28);--acc-ink:var(--acc);
  --s-wall:#5a4a40;--s-wall2:#655448;--s-floor:#6b5243;--s-floor2:#5c4639;--s-trim:#8c786a;--s-wood:#9a7158;--s-curtain:#e3d3c6;--s-dark:1;color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:26px 96px;display:grid;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.005em}
h2{font-size:23px;line-height:1.2}
h3{font-size:18px;line-height:1.25}
.masthead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;padding-inline:4px}
.masthead h1{font-style:italic;font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.08;letter-spacing:-.015em}
.label{font-family:var(--f-ui);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft)}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:22px;box-shadow:0 8px 28px var(--shadow);padding:20px;min-width:0}
.muted{color:var(--ink-soft)}
.note{font-size:14px;color:var(--ink-soft);margin:0;max-width:68ch}
.seg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:grid;gap:30px}
.block{display:grid;gap:12px;min-width:0;align-content:start}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:7px;border-bottom:1.5px solid var(--rule);margin-bottom:14px}
.block>.sechead,.side .sechead,.now .sechead{margin-bottom:0}

/* top */
.top{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.top{grid-template-columns:1fr}}
.main{display:grid;gap:22px;min-width:0}
.room{display:grid;gap:14px}
#scene{width:100%;max-width:100%;aspect-ratio:16/9;image-rendering:pixelated;display:block;border-radius:14px;background:var(--s-wall)}
.speech{position:relative;justify-self:start;max-width:100%;font-family:var(--f-pixel);font-size:15px;background:var(--wash);border-radius:14px;padding:7px 14px;margin-top:2px}
.speech::before{content:"";position:absolute;left:26px;top:-6px;width:12px;height:12px;background:var(--wash);transform:rotate(45deg);border-radius:2px}
.namebar{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.who{display:grid;gap:2px;min-width:0}
#pname{font-family:var(--f-pixel);font-size:30px;font-weight:600;color:var(--ink);background:transparent;border:0;border-bottom:1.5px dashed transparent;padding:0;width:100%;max-width:16ch;border-radius:0}
#pname:hover,#pname:focus{border-bottom-color:var(--rule);outline:none}
.title{font-family:var(--f-ui);font-size:12px;color:var(--acc-ink)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-ui);font-size:11.5px;padding:4px 11px;border-radius:999px;background:var(--wash);white-space:nowrap}
.pill b{font-weight:500;color:var(--acc-ink)}
.pill.hot{background:var(--c-create);color:var(--on-acc)}
.pill.hot b{color:var(--on-acc)}
.bar{height:8px;border-radius:999px;background:var(--wash);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--c,var(--acc));transition:width .5s ease}
.xprow{display:grid;gap:6px}
.xprow .bar{height:12px}
.xprow .bar>i{background:repeating-linear-gradient(90deg,var(--acc) 0 9px,var(--acc-deep) 9px 11px)}
.xprow .meta{display:flex;justify-content:space-between;gap:8px}

.side{display:grid;gap:22px;align-content:start}
.side .card{display:grid;gap:12px}
.stats{display:grid;gap:12px}
.stat{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.stat .ic{grid-row:span 2;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--c);color:var(--on-acc)}
.stat .nm{font-family:var(--f-display);font-size:16px}
.stat .nm .label{font-size:10px}
.stat .bar{grid-column:2 / 4}
.focus .hgwrap{display:flex;gap:16px;align-items:center}
#hg{width:44px;height:60px;image-rendering:pixelated;flex:none}
.timer{font-family:var(--f-pixel);font-size:42px;line-height:1;font-weight:600}

/* controls */
.btn{font-family:var(--f-ui);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;line-height:1.2;display:inline-block;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--acc-deep);background:var(--wash)}
.btn:active{transform:translateY(1px)}
.btn.on,.btn.primary{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.btn.primary:hover,.btn.on:hover{background:var(--acc-deep);border-color:var(--acc-deep)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft);padding:5px 8px}
.btn.ghost:hover{color:var(--acc-ink);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:2.5px solid var(--acc-deep);outline-offset:2px}
select,input[type=text],input[type=number],textarea{font-family:var(--f-body);font-size:14.5px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:110px;resize:vertical;background:var(--paper)}

/* encounter */
.enc{display:flex;flex-wrap:wrap;gap:14px;align-items:center;border:1.5px dashed var(--acc-deep);border-radius:20px;background:var(--paper);padding:14px 18px}
.enc .bang{font-family:var(--f-pixel);font-size:22px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--c-create);color:var(--on-acc);flex:none;animation:bob 1.2s steps(2) infinite}
.enc p{flex:1 1 240px;margin:0}
@keyframes bob{50%{transform:translateY(-3px)}}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{--t:var(--acc);font-family:var(--f-ui);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:1.5px solid var(--t);border-radius:999px;padding:8px 17px;cursor:pointer;transition:background .15s}
.tab:hover{background:color-mix(in srgb,var(--t) 22%,var(--paper))}
.tab[aria-selected="true"]{background:var(--t);color:var(--on-acc)}

/* quests */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:30px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.list{display:grid;list-style:none;margin:0;padding:0}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px dashed var(--line);border-radius:12px}
.q.done .qt{text-decoration:line-through;color:var(--ink-soft)}
.q.hint{background:color-mix(in srgb,var(--c) 18%,transparent)}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--on-acc);padding:0;transition:background .15s}
.check:hover{background:color-mix(in srgb,var(--c) 35%,transparent)}
.q.done .check{background:var(--c)}
.qt{min-width:0;overflow-wrap:anywhere}
.qt small{display:block;font-family:var(--f-ui);font-size:10px;color:var(--ink-soft);letter-spacing:.06em}
.xp{font-family:var(--f-ui);font-size:11.5px;color:var(--acc-ink);white-space:nowrap}
.addform{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.addform input[type=text]{flex:1 1 180px}
.addform input[type=number]{width:90px}
.empty{padding:18px;border:1.5px dashed var(--line);border-radius:16px;color:var(--ink-soft);font-size:14px;text-align:center}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:20px}
.dump{display:grid;gap:12px;padding:16px;border:1.5px dashed var(--acc-deep);border-radius:18px;background:var(--bg);margin-bottom:22px}
.dump .list{gap:8px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:6px;align-items:center}
@media (max-width:600px){.drow{grid-template-columns:1fr 1fr auto}.drow input{grid-column:1 / -1}}

/* skills */
.trees{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.tree{display:grid;gap:6px;justify-items:center;align-content:start;padding:14px 10px;border-radius:18px;background:color-mix(in srgb,var(--c) 14%,var(--paper))}
.tree h3{text-align:center}
.node{width:100%;max-width:190px;font-family:var(--f-body);font-size:13.5px;line-height:1.25;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:center}
.node.ready{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent)}
.node.got{background:var(--c);border-color:var(--c);color:var(--on-acc)}
.node.locked{opacity:.55}
.node.sel{outline:2.5px solid var(--acc-deep);outline-offset:2px}
.link{width:2px;height:10px;background:var(--line)}
.link.got{background:var(--c)}
.detail{display:grid;gap:12px;margin-top:18px;padding:16px;border-radius:18px;background:var(--wash)}
.detail input{flex:1 1 220px}

/* bosses */
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.boss{display:grid;gap:10px;padding:16px;border-radius:18px;background:color-mix(in srgb,var(--c) 12%,var(--paper));border:1.5px solid var(--line)}
.boss.dead{opacity:.7}
.boss canvas{width:96px;height:96px;image-rendering:pixelated;justify-self:center}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

/* shop, wardrobe, stickers */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item{display:grid;gap:10px;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);align-content:space-between}
.ward{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item.locked{opacity:.5}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:32px;height:32px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;background:var(--c)}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sws{display:flex;height:30px;border-radius:10px;overflow:hidden;border:1.5px solid var(--line)}
.sws i{flex:1}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sticker{display:grid;justify-items:center;gap:6px;text-align:center;padding:16px 10px;border-radius:18px;background:var(--bg);border:1.5px solid var(--line);align-content:start}
.sticker canvas{width:52px;height:52px;image-rendering:pixelated;padding:6px;border-radius:50%;background:var(--wash);box-sizing:content-box}
.sticker.locked{opacity:.55}
.sticker b{font-family:var(--f-display);font-weight:500;font-size:16px}
.sticker span{font-size:13px;color:var(--ink-soft)}

/* library & covers */
.now{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
@media (max-width:560px){.now{grid-template-columns:1fr}}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.now .shelf{grid-template-columns:repeat(3,minmax(0,1fr))}
.now .gcov b{font-size:13px}
.shelf.wide{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 14px}
.tile{display:grid;gap:6px;align-content:start;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:inherit;font:inherit;min-width:0}
.tile:hover .cov,.tile:hover .gcov{transform:translateY(-3px)}
.tile.sel .cov,.tile.sel .gcov{outline:2.5px solid var(--acc-deep);outline-offset:2px}
.tile .tt{font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.tile .tt small{display:block;color:var(--ink-soft);font-size:12px}
.tile .bar{height:5px}
.cov,.gcov{width:100%;aspect-ratio:2/3;border-radius:8px;box-shadow:0 6px 14px var(--shadow);transition:transform .15s}
.cov{object-fit:cover;display:block;background:var(--wash)}
.gcov{padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(165deg,var(--g1),var(--g2));color:#4b3340;overflow:hidden}
.gcov b{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:15px;line-height:1.1;overflow-wrap:break-word;hyphens:auto}
.gcov i{font-family:var(--f-ui);font-style:normal;font-size:9px;letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.slot{aspect-ratio:2/3;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);background:transparent;cursor:pointer;padding:6px}
.slot:hover{border-color:var(--acc-deep);color:var(--acc-ink)}
.libdetail{display:grid;grid-template-columns:120px minmax(0,1fr);gap:18px;padding:18px;border-radius:20px;background:var(--wash)}
@media (max-width:520px){.libdetail{grid-template-columns:1fr}.libdetail>.tile{max-width:130px}}
.libdetail .fields{display:grid;gap:10px;min-width:0}
.libdetail .fields input[type=text]{width:100%}
.stars{display:flex;gap:2px}
.star{background:none;border:0;padding:2px;font-size:20px;line-height:1;cursor:pointer;color:var(--line)}
.star.on{color:var(--c-create)}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.picks button{padding:0;border:0;background:none;cursor:pointer;border-radius:8px}

/* journal */
.jgrid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:30px;align-items:start}
@media (max-width:760px){.jgrid{grid-template-columns:1fr}}
.calhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.calhead h3{font-size:24px}
.calhead h3 em{color:var(--acc-ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dn{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.06em;text-align:center;color:var(--ink-soft);padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:50%;border:0;background:transparent;font-family:var(--f-ui);font-size:13px;color:var(--ink);cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
.cd:hover{background:var(--wash)}
.cd.out{color:var(--ink-soft);opacity:.45}
.cd.l1{background:color-mix(in srgb,var(--acc) 40%,transparent)}
.cd.l2{background:var(--acc);color:var(--on-acc)}
.cd.l3{background:var(--acc-deep);color:var(--on-acc)}
.cd.today{box-shadow:inset 0 0 0 2px var(--acc-ink)}
.cd.sel{outline:2px dashed var(--acc-ink);outline-offset:1px}
.chron{font-size:16px;line-height:1.7;max-width:68ch;margin:0;padding:16px 18px;border-radius:16px;background:var(--wash)}
.chron::first-letter{font-family:var(--f-display);font-style:italic;font-size:34px;float:left;line-height:1;margin:3px 7px 0 0;color:var(--acc-ink)}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:10px 56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.log li .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--line))}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;padding-inline:4px}
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:grid;gap:8px;z-index:20;width:max-content;max-width:calc(100% - 32px)}
.toast{background:var(--ink);color:var(--paper);font-family:var(--f-body);font-weight:600;font-size:15px;padding:10px 16px;border-radius:16px;box-shadow:0 10px 30px var(--shadow);display:flex;gap:12px;align-items:center;justify-content:space-between;animation:pop .25s ease}
.toast .btn{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
@keyframes pop{from{transform:translateY(8px);opacity:0}}
.confetti{position:fixed;width:8px;height:8px;z-index:30;pointer-events:none;animation:fall 1.3s steps(12) forwards}
@keyframes fall{to{transform:translate(var(--dx),70vh) rotate(180deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.bar>i,.cov,.gcov{transition:none}.confetti{display:none}.enc .bang,.toast{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="masthead"><h1 id="today"></h1><span class="label">Cozy Quest Room</span></header>
  <section class="top">
    <div class="main">

/* ---------- sound ---------- */
let ac=null;
function sfx(kind){
  if(!S.sound)return;
  const N={done:[[660,0,.07],[880,.07,.12]],level:[[523,0,.09],[659,.09,.09],[784,.18,.09],[1047,.27,.24]],combo:[[784,0,.07],[988,.07,.07],[1175,.14,.16]],focus:[[523,0,.16],[784,.16,.16],[659,.32,.16],[1047,.48,.4]],start:[[440,0,.08],[660,.08,.12]],buy:[[988,0,.06],[1319,.06,.14]]}[kind];
  if(!N)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    const t0=ac.currentTime;
    N.forEach(([f,s,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=kind==='focus'?'triangle':'square';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0+s);g.gain.exponentialRampToValueAtTime(0.035,t0+s+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+s+d);
      o.connect(g);g.connect(ac.destination);o.start(t0+s);o.stop(t0+s+d+0.03)});
  }catch(e){}
}

/* ---------- core actions ---------- */
function award(a,base,label,k){
  const now=Date.now(),before=P().l;
  let mult=1,combo=0;
  if(COMPLETE.includes(k)){
    S.combo=S.combo.filter(x=>now-x<HOUR);S.combo.push(now);combo=S.combo.length;
    if(combo>=3)mult=1.5;
    S.counts.done++;S.counts.maxCombo=Math.max(S.counts.maxCombo,combo);
    if(a==='rest')S.counts.rest++;
    if(/water|hydrat|drink/i.test(label))S.counts.water++;
    if(manaToday()==='low'&&!S.counts.lowDays.includes(today()))S.counts.lowDays.push(today());
  }
  const low=manaToday()==='low'&&base<=10?2:1;
  const xp=Math.round(base*low*mult),coins=Math.max(1,Math.round(xp/5));
  S.xp+=xp;S.stats[a]=(S.stats[a]||0)+xp;S.coins+=coins;
  S.log.unshift({d:today(),ts:now,t:label,xp,coins,a,k});S.log=S.log.slice(0,600);
  if(!S.days.includes(today()))S.days.push(today());S.days=S.days.slice(-400);
  anim.sparkle=now+1600;
  const after=P().l;
  if(after>before){
    const u=UNLOCKS.filter(x=>x.lv>before&&x.lv<=after).map(x=>x.n);
    toast('Level '+after+'! +1 skill point'+(u.length?' · new: '+u.join(', '):''));confetti();sfx('level');
  }else if(combo>=3){toast('Combo x'+combo+'! Hyperfocus bonus: 1.5x XP');sfx('combo');if(combo===3||combo%5===0)confetti()}
  else sfx('done');
  return {xp,coins,combo};
}
function doHit(b,quiet){
  if(!b||b.hp<=0)return;
  b.hp--;S.counts.hits++;
  award(b.a,15,'Hit '+b.name,'hit');

  else if(!quiet)toast('Hit! '+b.name+' has '+b.hp+' HP left',true);
}
function maybeEncounter(chance,gap){

}

function guessArea(t){for(const [a,r] of AK)if(r.test(t))return a;return 'work'}
function guessSize(t){
  if(/\b(finish|build|launch|project|whole|entire|deep clean|redesign|move|full)\b/i.test(t))return 'big';
  if(/\b(plan|prepare|write|study|research|record|edit|cook|clean)\b/i.test(t))return 'medium';
  if(/\b(reply|text|message|email|call|book|pay|order|send|check|drink|take|buy)\b/i.test(t))return 'tiny';
  return 'small';
}
function parseDump(txt){
  let lines=txt.split(/\n|;/);
  if(lines.filter(l=>l.trim()).length===1)lines=lines.join('').split(',');
  return lines.map(l=>l.replace(/^\s*([-*•·▪–]|\d+[.)]|\[.?\])\s*/,'').trim()).filter(Boolean).slice(0,40)
    .map(t=>({t:t.charAt(0).toUpperCase()+t.slice(1),a:guessArea(t),s:guessSize(t)}));
}

/* ---------- chronicle ---------- */
const DNAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function weekStart(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)-7*off);return d}
function chronicle(off){
  const ws=weekStart(off),we=new Date(ws);we.setDate(we.getDate()+7);
  const end=new Date(we);end.setDate(end.getDate()-1);
  const range=ws.getDate()+' '+MON[ws.getMonth()]+' – '+end.getDate()+' '+MON[end.getMonth()];
  const L=S.log.filter(l=>l.ts&&l.ts>=+ws&&l.ts<+we);
  const done=L.filter(l=>COMPLETE.includes(l.k));
  const xp=L.filter(l=>l.xp>0).reduce((s,l)=>s+l.xp,0);
  const days=new Set(done.map(l=>l.d)).size;
  const by={};done.forEach(l=>{if(l.a&&AREAS[l.a])by[l.a]=(by[l.a]||0)+l.xp});
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  const hits=L.filter(l=>l.k==='hit').length,kills=L.filter(l=>l.k==='boss').map(l=>l.t.replace(/^Defeated /,''));
  const foc=L.filter(l=>l.k==='focus').length,rest=done.filter(l=>l.a==='rest').length,enc=L.filter(l=>l.k==='enc').length;
  const hero=S.name||'Our hero';
  if(!done.length)return {range,text:off===0?'The week has only just begun, and the story is waiting for its first page. One tiny quest is enough to start it.':'This week '+hero+' stayed by the hearth and let the fire do the work. Every adventurer needs a quiet chapter, and this was one.'};
  const s=[];
  s.push((off===0?'So far this week, ':'In the week of '+range+', ')+hero+' the '+titleFor(P().l)+' set out from her cozy room on '+days+(days===1?' day.':' different days.'));
  s.push('She completed '+done.length+' quest'+(done.length===1?'':'s')+' and gathered '+xp+' XP'+(top?', most of it in '+AREAS[top[0]].name+', so her '+AREAS[top[0]].stat+' grew the strongest.':'.'));
  if(kills.length)s.push(kills.join(' and ')+(kills.length>1?' fell':' fell')+' before her!');
  else if(hits)s.push('She struck at her bosses '+hits+' time'+(hits===1?'':'s')+', and they are getting nervous.');
  if(foc)s.push('She brewed '+foc+' focus potion'+(foc===1?'':'s')+'.');
  if(rest)s.push('She rested '+rest+' time'+(rest===1?'':'s')+', which is also a quest.');
  const bk=L.filter(l=>l.k==='lib'&&/^Finished reading/.test(l.t)).length,wt=L.filter(l=>l.k==='lib'&&/^Finished watching/.test(l.t)).length;
  if(bk||wt)s.push('In the evenings she '+(bk?'finished '+bk+' book'+(bk===1?'':'s'):'')+(bk&&wt?' and ':'')+(wt?'watched '+wt+' film'+(wt===1?'':'s')+' or series':'')+'.');
  if(enc)s.push('Along the way she helped '+enc+' wandering visitor'+(enc===1?'':'s')+'.');
  const close=['The hearth glows a little brighter.','The cat approves.','Onward, gently.','The room feels more like home.'];
  s.push(close[(ws.getDate()+ws.getMonth())%close.length]);
  return {range,text:s.join(' ')};
}

function parseSave(t){
  t=(t||'').trim();

async function download(name,text){

function shrinkImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const W=160,H=240,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');const k=Math.max(W/im.width,H/im.height),w=im.width*k,h=im.height*k;x.drawImage(im,(W-w)/2,(H-h)/2,w,h);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
async function findCovers(){
  const it=selItem();if(!it)return;
  coverMsg='Looking for covers…';coverResults=null;render();
  try{
    let res=[];
    if(it.kind==='book'){const r=await fetch('https://openlibrary.org/search.json?q='+encodeURIComponent(it.t+(it.by?' '+it.by:''))+'&limit=12&fields=title,author_name,cover_i');const j=await r.json();
      res=(j.docs||[]).filter(d=>d.cover_i).slice(0,8).map(d=>({url:'https://covers.openlibrary.org/b/id/'+d.cover_i+'-M.jpg',by:(d.author_name||[])[0]||'',lab:d.title}))}
    else if(it.kind==='show'){const r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(it.t));const j=await r.json();
      res=j.filter(x=>x.show&&x.show.image).slice(0,8).map(x=>({url:x.show.image.medium.replace(/^http:/,'https:'),by:(x.show.premiered||'').slice(0,4),lab:x.show.name}))}
    else{const r=await fetch('https://itunes.apple.com/search?media=movie&limit=10&term='+encodeURIComponent(it.t));const j=await r.json();
      res=(j.results||[]).filter(x=>x.artworkUrl100).slice(0,8).map(x=>({url:x.artworkUrl100.replace('100x100','300x450'),by:(x.releaseDate||'').slice(0,4),lab:x.trackName}))}

}

try{const l=localStorage.getItem('cqr-save');if(l)adopt(JSON.parse(l))}catch(e){}
$('#savestate').textContent='Saved on this device';
if(S.lastSeen&&Date.now()-S.lastSeen>7*DAY){S.counts.welcome++;S.coins+=20;setTimeout(()=>toast('Welcome back, hero. Your room missed you. +20 coins'),700)}
maybeEncounter(.6,3*HOUR);
anim.wave=Date.now()+2600;
S.lastSeen=Date.now();
checkAch();render();save();
if(S.focus&&Date.now()>=S.focus.start+S.focus.dur*6e4)setTimeout(finishFocus,500);

let lastDay=today();
setInterval(()=>{
  tick++;
  if(S.focus){
    const left=S.focus.start+S.focus.dur*6e4-Date.now();
    if(left<=0){finishFocus();return}
    if(tick%4===0&&!document.hidden){const el=$('#focus-time');if(el)el.textContent=fmtLeft();const hg=$('#hg');if(hg)drawHG(hg,1-left/(S.focus.dur*6e4));document.title=fmtLeft()+' · '+baseTitle}
  }
  if(document.hidden)return;
  if(tick%40===0&&today()!==lastDay){lastDay=today();render()}
  if(!RM.matches)drawScene();
},150);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint);
document.addEventListener('error',e=>{const im=e.target;if(im&&im.matches&&im.matches('img[data-cov]')){const it=S.lib.find(x=>x.id===im.dataset.cov);if(it)im.outerHTML=gcov(it)}},true);
new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(tab==='save')render()});
if(window.CQR_PWA&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    docRef=db.collection('data/users/'+id).doc('save');
    const sn=await docRef.get();
    if(sn.exists){const d=sn.data();if(d&&d.json&&(d.updated||0)>(S.updated||0)){adopt(JSON.parse(d.json));try{localStorage.setItem('cqr-save',d.json)}catch(e){}render()}else save()}
    else save();
    $('#savestate').textContent='Saved to your account';
  }catch(e){}
})();
})();
</script>

</body>
</html>
