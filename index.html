<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cozy Quest Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Mali:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
<style>
/* Layout: a little pixel room up top (avatar, level, stats, mana), a pixel tab bar, then one game screen at a time */
:root{
  --bg:#fbeef0; --paper:#fffaf6; --ink:#5b3f4a; --ink-soft:#8d6c78; --line:#e6bfc8; --shadow:#ecc9d0; --dot:#f1d3d9;
  --rose:#e98fa4; --rose-deep:#c65f79; --lilac:#b49ad8; --sage:#8db898; --butter:#f0c063; --wood:#b9805f; --on-accent:#fffaf6;
  --s-wall:#f6c9cf; --s-wall2:#fbe0e3; --s-floor:#c98f6b; --s-floor2:#b57b59; --s-sky:#cfe9f1; --s-frame:#fff5ef; --s-curtain:#fffaf5; --s-night:0;
  --f-display:"Pixelify Sans","Courier New",monospace;
  --f-body:"Mali","Trebuchet MS",system-ui,sans-serif;
  --f-ui:"Silkscreen","Courier New",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#231a2a; --paper:#2f2438; --ink:#f5e4eb; --ink-soft:#bfa3b5; --line:#4f3c5a; --shadow:#140e19; --dot:#2d2234;
  --rose:#ee9bb0; --rose-deep:#f6b6c6; --lilac:#c6b0f2; --sage:#93c7a3; --butter:#f2cd7c; --wood:#9a6b52; --on-accent:#2a1d2e;
  --s-wall:#5a3d5e; --s-wall2:#6a4b6e; --s-floor:#6f4b3f; --s-floor2:#5c3d33; --s-sky:#28285a; --s-frame:#8a6a86; --s-curtain:#c9a9c4; --s-night:1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#231a2a; --paper:#2f2438; --ink:#f5e4eb; --ink-soft:#bfa3b5; --line:#4f3c5a; --shadow:#140e19; --dot:#2d2234;
  --rose:#ee9bb0; --rose-deep:#f6b6c6; --lilac:#c6b0f2; --sage:#93c7a3; --butter:#f2cd7c; --wood:#9a6b52; --on-accent:#2a1d2e;
  --s-wall:#5a3d5e; --s-wall2:#6a4b6e; --s-floor:#6f4b3f; --s-floor2:#5c3d33; --s-sky:#28285a; --s-frame:#8a6a86; --s-curtain:#c9a9c4; --s-night:1;
  color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(var(--dot) 1.5px,transparent 2px);background-size:22px 22px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:22px 64px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:22px}
h3{font-size:17px}
.label{font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.num{font-family:var(--f-ui);font-variant-numeric:tabular-nums}
.card{background:var(--paper);border:3px solid var(--line);box-shadow:5px 5px 0 var(--shadow);padding:16px;min-width:0}
.muted{color:var(--ink-soft)}

/* top room */
.top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.top{grid-template-columns:1fr}}
.room{display:grid;gap:14px}
.sceneframe{position:relative}
#scene{width:100%;max-width:100%;aspect-ratio:64/40;image-rendering:pixelated;display:block;border:3px solid var(--line);background:var(--s-wall)}
.namebar{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}
.who{display:grid;gap:2px;min-width:0}
#pname{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--ink);background:transparent;border:0;border-bottom:2px dashed transparent;padding:0;width:100%;max-width:16ch}
#pname:hover,#pname:focus{border-bottom-color:var(--line);outline:none}
.title{font-family:var(--f-ui);font-size:12px;color:var(--rose-deep)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-family:var(--f-ui);font-size:12px;padding:4px 10px;border:2px solid var(--line);background:var(--bg);white-space:nowrap}
.pill b{font-weight:400;color:var(--rose-deep)}
.bar{height:16px;border:2px solid var(--ink-soft);background:var(--bg);position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,var(--c,var(--rose)) 0 8px,color-mix(in srgb,var(--c,var(--rose)) 75%,var(--ink)) 8px 10px);transition:width .4s steps(8)}
.xprow{display:grid;gap:4px}
.xprow .meta{display:flex;justify-content:space-between;gap:8px}

.side{display:grid;gap:16px;align-content:start}
.stats{display:grid;gap:12px}
.stat{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.stat .ic{grid-row:span 2;width:28px;height:28px;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;background:var(--c);color:var(--on-accent);border:2px solid color-mix(in srgb,var(--c) 70%,var(--ink))}
.stat .nm{font-family:var(--f-display);font-size:16px}
.stat .bar{grid-column:2 / 4;height:12px}
.mana{display:grid;gap:8px}
.potions{display:flex;flex-wrap:wrap;gap:8px}
.manatip{font-size:14px;margin:0}

/* buttons */
.btn{font-family:var(--f-ui);font-size:12px;color:var(--ink);background:var(--paper);border:2px solid var(--ink-soft);box-shadow:3px 3px 0 var(--shadow);padding:6px 10px;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--bg)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.on,.btn.primary{background:var(--rose);color:var(--on-accent);border-color:var(--rose-deep)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;color:var(--ink-soft);padding:4px 6px}
.btn.ghost:hover{color:var(--rose-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
:focus-visible{outline:3px dashed var(--rose-deep);outline-offset:2px}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tab{font-family:var(--f-display);font-size:16px;font-weight:500;color:var(--ink);background:var(--paper);border:3px solid var(--line);box-shadow:4px 4px 0 var(--shadow);padding:6px 14px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--rose);border-color:var(--rose-deep);color:var(--on-accent)}
.tab:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}

/* quests */
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.list{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border:2px solid var(--line);background:var(--bg);border-left:8px solid var(--c)}
.q.done .qt{text-decoration:line-through;color:var(--ink-soft)}
.q.hint{outline:2px dashed var(--c);outline-offset:2px}
.check{width:26px;height:26px;border:2px solid var(--ink-soft);background:var(--paper);cursor:pointer;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:var(--on-accent);padding:0}
.q.done .check{background:var(--c);border-color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.qt{min-width:0;overflow-wrap:anywhere}
.qt small{display:block;font-family:var(--f-ui);font-size:10px;color:var(--ink-soft);letter-spacing:.04em}
.xp{font-family:var(--f-ui);font-size:11px;color:var(--rose-deep);white-space:nowrap}
.addform{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.addform input[type=text],.addform input[type=number],.addform select,.field{font-family:var(--f-body);font-size:14px;color:var(--ink);background:var(--bg);border:2px solid var(--line);padding:6px 8px;min-width:0}
.addform input[type=text]{flex:1 1 180px}
.addform input[type=number]{width:84px}
.empty{padding:14px;border:2px dashed var(--line);color:var(--ink-soft);font-size:14px;text-align:center}

/* skills */
.trees{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:860px){.trees{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.trees{grid-template-columns:1fr}}
.tree{display:grid;gap:6px;justify-items:center;padding:12px 8px;border:2px solid var(--line);background:var(--bg)}
.tree h3{text-align:center}
.node{width:100%;max-width:190px;font-family:var(--f-body);font-size:13px;line-height:1.25;color:var(--ink);background:var(--paper);border:3px solid var(--line);padding:8px;cursor:pointer;text-align:center;position:relative}
.node.ready{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.node.got{background:var(--c);border-color:color-mix(in srgb,var(--c) 70%,var(--ink));color:var(--on-accent)}
.node.locked{opacity:.55}
.node.sel{outline:3px dashed var(--rose-deep);outline-offset:2px}
.link{width:4px;height:12px;background:var(--line)}
.link.got{background:var(--c)}
.nodedetail{display:grid;gap:10px;margin-top:16px;padding:14px;border:2px solid var(--line);background:var(--bg)}
.nodedetail .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nodedetail input{flex:1 1 220px}

/* bosses */
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.boss{display:grid;gap:10px;padding:14px;border:3px solid var(--line);background:var(--bg)}
.boss.dead{opacity:.7}
.boss canvas{width:96px;height:96px;image-rendering:pixelated;justify-self:center}
.boss .row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

/* shop & wardrobe */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item{display:grid;gap:8px;padding:12px;border:2px solid var(--line);background:var(--bg);align-content:space-between}
.item .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ward{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ward .item.locked{opacity:.5}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border:3px solid var(--line);cursor:pointer;padding:0;background:var(--c)}
.sw.on{border-color:var(--ink);box-shadow:3px 3px 0 var(--shadow)}

/* journal */
.week{display:flex;gap:6px;flex-wrap:wrap}
.day{width:34px;display:grid;gap:4px;justify-items:center;font-family:var(--f-ui);font-size:10px;color:var(--ink-soft)}
.day i{width:22px;height:22px;border:2px solid var(--line);background:var(--paper)}
.day.on i{background:var(--rose);border-color:var(--rose-deep)}
.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;padding:7px 0;border-bottom:2px dotted var(--line);font-size:14px}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--f-display);font-size:15px;padding:10px 14px;border:3px solid var(--rose);box-shadow:4px 4px 0 var(--shadow);display:flex;gap:12px;align-items:center;z-index:20;max-width:calc(100% - 32px)}
#toast .btn{background:var(--rose);color:var(--on-accent);border-color:var(--rose-deep);box-shadow:none}
.confetti{position:fixed;width:8px;height:8px;z-index:30;pointer-events:none;animation:fall 1.3s steps(12) forwards}
@keyframes fall{to{transform:translate(var(--dx),70vh) rotate(180deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}.confetti{display:none}}
</style>
</head>
<body>


<div class="wrap">
  <section class="top">
    <div class="card room">
      <div class="sceneframe"><canvas id="scene" width="64" height="40" aria-label="Your pixel character in her cozy room"></canvas></div>
      <div class="namebar">
        <div class="who">
          <label class="label" for="pname">Player</label>
          <input id="pname" type="text" maxlength="24" autocomplete="off">
          <span class="title" id="ptitle"></span>
        </div>
        <div class="pills" id="pills"></div>
      </div>
      <div class="xprow">
        <div class="meta"><span class="label" id="lvl"></span><span class="label num" id="xptxt"></span></div>
        <div class="bar"><i id="xpfill"></i></div>
      </div>
    </div>
    <div class="side">
      <div class="card">
        <div class="sechead"><h2>Stats</h2><span class="label">grow by doing</span></div>
        <div class="stats" id="stats"></div>
      </div>
      <div class="card mana">
        <div class="sechead" style="margin:0"><h2>Mana check-in</h2><span class="label">today</span></div>
        <div class="potions" id="potions"></div>
        <p class="manatip" id="manatip"></p>
      </div>
    </div>
  </section>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <section class="card" id="view"></section>

  <div class="foot muted"><span id="savestate">Loading your save…</span><span>Tiny steps count. No streak ever breaks here.</span></div>
</div>
<div id="toast" hidden></div>

<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const AREAS={
  work:{name:'Teaching',stat:'Charisma',c:'var(--rose)',ic:'♥'},
  study:{name:'Study & CPE',stat:'Wisdom',c:'var(--lilac)',ic:'✦'},
  health:{name:'Self-care',stat:'Vitality',c:'var(--sage)',ic:'✿'},
  create:{name:'Creative',stat:'Creativity',c:'var(--butter)',ic:'✎'}
};
const SIZES={tiny:{xp:10,label:'Tiny · ~5 min'},small:{xp:25,label:'Small · ~15 min'},medium:{xp:50,label:'Medium · ~1 hr'},big:{xp:100,label:'Big · half a day'}};
const TITLES=[[1,'Apprentice of the Hearth'],[3,'Cozy Adventurer'],[5,'Hearth Mage'],[8,'Word Witch'],[12,'Mind Weaver'],[16,'Grand Tutor'],[20,'Living Legend']];
const UNLOCKS=[
  {k:'bow',lv:2,n:'Ribbon bow'},{k:'cat',lv:3,n:'Cat companion'},{k:'phones',lv:4,n:'Study headphones'},
  {k:'book',lv:5,n:'Spellbook'},{k:'plant',lv:6,n:'Monstera'},{k:'lights',lv:8,n:'Fairy lights'},
  {k:'crown',lv:10,n:'Tiny crown'},{k:'wings',lv:15,n:'Pixie wings'},{k:'aura',lv:20,n:'Legend sparkles'}];
const HAIR={brown:'#6b4436',pink:'#e7a0b6',black:'#2e2430',blonde:'#e6c57a',lilac:'#ad93d6'};
const SWEATER={lilac:'#b9a0dc',rose:'#ec9cb0',sage:'#94bf9f',butter:'#f1c86f',cream:'#f6ece0'};

function fresh(){
  const T=(a)=>a.map(n=>({id:uid(),n,on:false}));
  return {v:1,name:'Polina',xp:0,coins:0,stats:{work:0,study:0,health:0,create:0},
    mana:{d:'',v:''},
    dailies:[['Drink water through the day','health','tiny'],['Eat one real meal','health','tiny'],['15 min CPE vocab','study','small'],['Reply to students','work','tiny'],['10 min outside or a stretch','health','tiny'],['Make one small creative thing','create','small']].map(([t,a,s])=>({id:uid(),t,a,s,done:''})),
    quests:[['Plan this week’s lessons','work','medium'],['Do one CPE reading paper','study','medium'],['Post one piece of content','create','small'],['Write an essay and get feedback','study','big'],['Change the bedsheets','health','small']].map(([t,a,s])=>({id:uid(),t,a,s})),
    bosses:[{id:uid(),name:'The CPE Dragon',a:'study',hp:40,max:40},{id:uid(),name:'Full Schedule Golem',a:'work',hp:25,max:25}],
    shop:[['One episode of a show',20],['Guilt-free scroll, 20 min',25],['Fancy coffee or tea',35],['New sticker or stationery',60],['A whole lazy evening',120]].map(([t,cost])=>({id:uid(),t,cost})),
    tree:{work:T(['Lesson Flow','Medical English','Student Magnet','Full Schedule','Signature Method']),
          study:T(['Daily Vocab','Reading Stamina','Essay Craft','Mock Exam','CPE Certified']),
          health:T(['Water Sprite','Sleep Ritual','Daily Movement','Rest Without Guilt','Steady Energy']),
          create:T(['Canva Wizard','App Builder','Game Designer','Content Rhythm','Shipped Project'])},
    look:{hair:'brown',sweater:'lilac',off:{}},
    log:[],days:[],updated:0};
}
let S=fresh();
let tab='quests', selNode=null, undoSnap=null;
try{tab=localStorage.getItem('cqr-tab')||'quests'}catch(e){}

/* ---------- math ---------- */
function curve(xp,base,step){let l=1,need=base;while(xp>=need){xp-=need;l++;need+=step}return{l,into:xp,need}}
const P=()=>curve(S.xp,100,40);
const ST=a=>curve(S.stats[a],60,30);
const unlockedCount=()=>Object.values(S.tree).flat().filter(n=>n.on).length;
const sp=()=>P().l-unlockedCount();
const titleFor=l=>TITLES.filter(t=>l>=t[0]).pop()[1];
const isOn=k=>{const u=UNLOCKS.find(x=>x.k===k);return P().l>=u.lv && !S.look.off[k]};
const manaToday=()=>S.mana.d===today()?S.mana.v:'';
function weekDays(){const out=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);out.push(dayKey(d))}return out}

/* ---------- actions ---------- */
function award(a,base,label){
  const before=P().l;
  const bonus=manaToday()==='low'&&base<=10?2:1;
  const xp=base*bonus, coins=Math.max(1,Math.round(xp/5));
  S.xp+=xp;S.stats[a]+=xp;S.coins+=coins;
  S.log.unshift({d:today(),t:label,xp,coins});S.log=S.log.slice(0,80);
  if(!S.days.includes(today()))S.days.push(today());S.days=S.days.slice(-60);
  const after=P().l;
  if(after>before){
    const u=UNLOCKS.filter(x=>x.lv>before&&x.lv<=after).map(x=>x.n);
    toast('Level '+after+'! +1 skill point'+(u.length?' · unlocked '+u.join(', '):''));confetti();
  }
  return {xp,coins};
}
function snap(){undoSnap=JSON.stringify(S)}
function commit(){S.updated=Date.now();render();save()}

const ACT={
  tab(v){tab=v;try{localStorage.setItem('cqr-tab',v)}catch(e){}render()},
  mana(v){S.mana={d:today(),v};commit()},
  daily(id){
    const q=S.dailies.find(x=>x.id===id);if(!q)return;
    if(q.done===today()){ // un-tick: give it back
      const g=q.gain||{xp:SIZES[q.s].xp,coins:Math.round(SIZES[q.s].xp/5)};
      S.xp=Math.max(0,S.xp-g.xp);S.stats[q.a]=Math.max(0,S.stats[q.a]-g.xp);S.coins=Math.max(0,S.coins-g.coins);
      const i=S.log.findIndex(l=>l.t===q.t&&l.d===today());if(i>-1)S.log.splice(i,1);
      q.done='';q.gain=null;
    } else {q.gain=award(q.a,SIZES[q.s].xp,q.t);q.done=today();toast('+'+q.gain.xp+' XP · '+AREAS[q.a].stat)}
    commit()},
  quest(id){
    const q=S.quests.find(x=>x.id===id);if(!q)return;snap();
    const g=award(q.a,SIZES[q.s].xp,q.t);S.quests=S.quests.filter(x=>x.id!==id);
    commit();toast('Quest done · +'+g.xp+' XP, +'+g.coins+' coins',true)},
  delquest(id){snap();S.quests=S.quests.filter(x=>x.id!==id);commit();toast('Quest removed',true)},
  deldaily(id){snap();S.dailies=S.dailies.filter(x=>x.id!==id);commit();toast('Daily removed',true)},
  hit(id){
    const b=S.bosses.find(x=>x.id===id);if(!b||b.hp<=0)return;snap();
    b.hp--;const g=award(b.a,15,'Hit '+b.name);
    if(b.hp===0){const r=award(b.a,b.max*5,'Defeated '+b.name);toast(b.name+' defeated! +'+r.xp+' XP, +'+r.coins+' coins');confetti()}
    else toast('Hit! '+b.name+' has '+b.hp+' HP left',true);
    commit()},
  heal(id){const b=S.bosses.find(x=>x.id===id);if(b&&b.hp<b.max){b.hp++;commit()}},
  delboss(id){snap();S.bosses=S.bosses.filter(x=>x.id!==id);commit();toast('Boss removed',true)},
  buy(id){
    const it=S.shop.find(x=>x.id===id);if(!it)return;
    if(S.coins<it.cost){toast('You need '+(it.cost-S.coins)+' more coins');return}
    snap();S.coins-=it.cost;S.log.unshift({d:today(),t:'Bought: '+it.t,xp:0,coins:-it.cost});commit();toast('Enjoy it. You earned this.',true)},
  delitem(id){snap();S.shop=S.shop.filter(x=>x.id!==id);commit();toast('Reward removed',true)},
  node(id){selNode=selNode===id?null:id;render()},
  unlock(id){
    const f=findNode(id);if(!f||!canUnlock(f.a,f.i))return;snap();f.n.on=true;commit();toast('Skill unlocked: '+f.n.n,true);confetti()},
  relock(id){const f=findNode(id);if(!f)return;const t=S.tree[f.a];if(t[f.i+1]&&t[f.i+1].on){toast('Lock the next skill in this branch first');return}f.n.on=false;commit()},
  equip(k){S.look.off[k]=!S.look.off[k];commit()},
  hair(v){S.look.hair=v;commit()},
  sweater(v){S.look.sweater=v;commit()},
  undo(){if(!undoSnap)return;S=JSON.parse(undoSnap);undoSnap=null;hideToast();commit()},
  reset(){if(resetArm){S=fresh();resetArm=false;commit();toast('Fresh start. Level 1 again.')}else{resetArm=true;render();setTimeout(()=>{resetArm=false;render()},5000)}}
};
let resetArm=false;
function findNode(id){for(const a in S.tree){const i=S.tree[a].findIndex(n=>n.id===id);if(i>-1)return{a,i,n:S.tree[a][i]}}}
function canUnlock(a,i){const t=S.tree[a];return !t[i].on&&(i===0||t[i-1].on)&&ST(a).l>=i+1&&sp()>0}

let tt;

function confetti(){

  for(let i=0;i<28;i++){const d=document.createElement('i');d.className='confetti';

  const l=P().l;
  return '<div class="sechead"><h2>Wardrobe</h2><span class="label">your character evolves as you level</span></div>'+
  '<div class="cols" style="margin-bottom:18px"><div><span class="label">Hair</span><div class="swatches" style="margin-top:6px">'+Object.entries(HAIR).map(([k,c])=>'<button class="sw'+(S.look.hair===k?' on':'')+'" style="--c:'+c+'" data-act="hair" data-v="'+k+'" aria-label="'+k+' hair"></button>').join('')+'</div></div>'+
  '<div><span class="label">Sweater</span><div class="swatches" style="margin-top:6px">'+Object.entries(SWEATER).map(([k,c])=>'<button class="sw'+(S.look.sweater===k?' on':'')+'" style="--c:'+c+'" data-act="sweater" data-v="'+k+'" aria-label="'+k+' sweater"></button>').join('')+'</div></div></div>'+
  '<div class="ward">'+UNLOCKS.map(u=>{const got=l>=u.lv,on=got&&!S.look.off[u.k];return '<div class="item'+(got?'':' locked')+'"><span>'+u.n+'</span><div class="row"><span class="label">Lv '+u.lv+'</span>'+(got?'<button class="btn'+(on?' on':'')+'" data-act="equip" data-v="'+u.k+'" aria-pressed="'+on+'">'+(on?'Wearing':'Wear')+'</button>':'<span class="label">locked</span>')+'</div></div>'}).join('')+'</div>';
}
function vJournal(){
  const days=weekDays(),names=['Su','Mo','Tu','We','Th','Fr','Sa'];
  return '<div class="sechead"><h2>Adventure journal</h2><span class="label">last 7 days</span></div>'+
  '<div class="week" style="margin-bottom:16px">'+days.map(d=>{const dt=new Date(d+'T12:00');return '<span class="day'+(S.days.includes(d)?' on':'')+'"><i></i>'+names[dt.getDay()]+'</span>'}).join('')+'</div>'+
  (S.log.length?'<ul class="log">'+S.log.slice(0,40).map(l=>'<li><span class="label num">'+l.d.slice(5)+'</span><span>'+esc(l.t)+'</span><span class="xp">'+(l.xp?'+'+l.xp+' XP':l.coins+' coins')+'</span></li>').join('')+'</ul>'
  :'<div class="empty">Your journal fills itself as you finish quests.</div>')+
  '<div style="margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn ghost" data-act="reset">'+(resetArm?'Tap again to erase everything':'Start over from level 1')+'</button></div>';
}

/* ---------- saving ---------- */
let docRef=null,saveT=null;
function save(){
  try{localStorage.setItem('cqr-save',JSON.stringify(S))}catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{if(!docRef)return;try{await docRef.set({json:JSON.stringify(S),updated:S.updated});$('#savestate').textContent='Saved to your account'}catch(e){$('#savestate').textContent='Saved on this device (account save failed)'}},700);
}
function adopt(o){if(o&&o.v===1){const f=fresh();S=Object.assign(f,o,{look:Object.assign(f.look,o.look||{}),stats:Object.assign(f.stats,o.stats||{})})}}
try{const l=localStorage.getItem('cqr-save');if(l)adopt(JSON.parse(l))}catch(e){}
$('#savestate').textContent='Saved on this device';
render();
['(prefers-color-scheme: dark)'].forEach(q=>matchMedia(q).addEventListener('change',()=>render()));
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    docRef=db.collection('data/users/'+id).doc('save');
    const snapd=await docRef.get();
    if(snapd.exists){const d=snapd.data();if(d&&d.json&&(d.updated||0)>=(S.updated||0)){adopt(JSON.parse(d.json));try{localStorage.setItem('cqr-save',d.json)}catch(e){}render()}else save()}
    else save();
    $('#savestate').textContent='Saved to your account';
  }catch(e){}
})();
})();
</script>
